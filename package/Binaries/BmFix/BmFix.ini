; BmFix configuration. faultrep.dll goes next to ShippingPC-BmGame.exe, and this folder goes next to faultrep.dll.
; After you change a value, restart the game. To remove BmFix, delete faultrep.dll and this folder.

; hook=0   Turns off all fixes inside the game (preload, warm, stream_ms). They are on by default.
hook=1
; preload=0   Turns off the preload. With the preload, BmFix sends new textures and mesh buffers to the GPU a few
;             frames after the game creates them (4 at most in each frame), not in the first frame that draws them.
preload=1
; warm=0   Turns off the shader warm-up. The NVIDIA D3D9 driver compiles a shader the first time that the game draws
;          with it. BmFix records each shader combination that the game draws in BmFixCombos.bin. In later sessions,
;          the driver compiles them while the game loads. In an area that you visit for the first time, the driver
;          still compiles them one time.
warm=1
; stream_ms   The time in ms that the engine can spend in each frame to show a streamed level. The game default is 5.
stream_ms=1.0
; physx_cache=0   Turns off the PhysX cloth cache. With PhysX on, the game cooks each cloth mesh (banners, flags) on
;                 the game thread in every session, 10-20 ms for each mesh. BmFix keeps the cooked meshes in
;                 BmFixPhysX.bin.
physx_cache=1
; trace=1   Writes each frame that takes more than 8.33 ms (120 fps) to logs\BmFixHook.log ("P f=... frame_us=...").
trace=0
; localization=0   Turns off the fix for the language files. The game looks for about 110 .int files that it does
;                  not have.
localization=1
; dxvk=1   Runs the game on Vulkan through DXVK (dxvk\dxvk_d3d9.dll in this folder). DXVK compiles shaders in the
;          background. In tests, it was slower than native D3D9 with the warm-up, so it is off. With dxvk=1, the
;          preload and the warm-up are off, and DXVK replaces any other d3d9.dll mod (ReShade) for this game.
dxvk=0

[overrides]
; Each time that the game starts, BmFix applies these lines to a read-only copy of
; Documents\Square Enix\Batman Arkham Asylum GOTY\BmGame\Config\BmEngine.ini. The game reads that copy.
; BmFix never changes your own file or the values that your launcher writes in it.
; BmFix does not change the frame rate limit. To set a limit here, add a line such as MaxSmoothedFrameRate=180.
; To remove the limit of the game, add bSmoothFrameRate=False.
; With this line, the game creates each shader when its level loads, not when the shader first comes into view:
bInitializeShadersOnDemand=False
