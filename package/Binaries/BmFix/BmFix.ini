; BmFix settings (drop-in: faultrep.dll next to ShippingPC-BmGame.exe, this folder next to it).
; Restart the game after a change. Delete faultrep.dll and this folder to uninstall.

; hook=0   turns the in-game fixes below off (preload, warm, stream_ms). On by default.
hook=1
; preload=0   turns off uploading new textures/mesh buffers to the GPU a few frames after creation
;             (at most 4 per frame) instead of on first draw.
preload=1
; warm=0   turns off the shader warm-up. The NVIDIA D3D9 driver compiles a shader the first time it is drawn;
;          every shader combination the game draws is remembered in BmFixCombos.bin and compiled while the
;          game loads in later sessions. Areas seen for the first time still compile once.
warm=1
; stream_ms   per-frame time budget (ms) the engine may spend making a streamed level visible (game default 5).
stream_ms=1.0
; physx_cache=0   turns off the PhysX cloth cache. With PhysX on, the game cooks each cloth mesh (banners, flags)
;                 on the game thread, 10-20 ms each, every session; cooked meshes are kept in BmFixPhysX.bin.
physx_cache=1
; trace=1   writes every frame slower than 8.33 ms (120 fps) to logs\BmFixHook.log ("P f=... frame_us=...").
trace=0
; localization=0   turns off the localization-lookup fix (the game looks up ~110 .int files it never shipped).
localization=1
; dxvk=1   runs the game on Vulkan through DXVK (dxvk\dxvk_d3d9.dll in this folder): shaders compiled in the
;          background. Measured worse than native + warm-up here, so off. preload/warm are off with dxvk=1, and it
;          replaces any other d3d9.dll mod (ReShade) for this game.
dxvk=0

[overrides]
; Applied to a read-only copy of Documents\Square Enix\Batman Arkham Asylum GOTY\BmGame\Config\BmEngine.ini at
; every launch; the game reads that copy. Your own file (and your launcher's settings in it) is never modified.
; The frame cap is left as your config / launcher sets it. To change it here instead, add a line such as
; MaxSmoothedFrameRate=180 (the game's own limiter), or bSmoothFrameRate=False to remove the limiter.
; Create every shader when its level loads instead of on first sight:
bInitializeShadersOnDemand=False
