# Batman: Arkham Asylum GOTY - DXVK config (BmFix points DXVK_CONFIG_FILE here when dxvk=1; game folder untouched)
# Compile shaders through VK_EXT_graphics_pipeline_library at creation time instead of on first draw.
dxvk.enableGraphicsPipelineLibrary = True
# No DXVK-side frame cap; the engine cap is set in BmEngine.ini.
d3d9.maxFrameRate = 0
# Match the game's MaxAnisotropy=16.
d3d9.samplerAnisotropy = 16
